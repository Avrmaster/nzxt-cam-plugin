<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Villiam Thermal Companion</title>
<style>
  :root {
    /* State colors: sleep → walk → run → panic */
    --c-sleep: #2d6cdf;
    --c-walk:  #22b573;
    --c-run:   #f5a623;
    --c-panic: #e23b3b;
    /* Villiam's actual colouring, sampled from his photos */
    --fur-cream:   #f7efe2;
    --fur-shadow:  #e0d3bf;
    --fur-chest:   #b06231;
    --fur-chest-d: #8d4c24;
    --nose:        #2b2725;
    --collar:      #57bd2c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    user-select: none;
  }

  #stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  #glow {
    position: absolute;
    width: 88%; aspect-ratio: 1;
    border-radius: 50%;
    background-color: var(--c-sleep);
    opacity: 0.32;
    filter: blur(48px);
    transition: background-color 1.6s ease;
  }

  #ring {
    position: absolute; inset: 2%;
    border-radius: 50%;
    border: 3px solid var(--c-sleep);
    opacity: 0.85;
    transition: border-color 1.6s ease;
  }

  /* ---- Orbit rig ----
     #arm rotates around the centre, #radius pushes Villiam out to the rim
     (radius 0 = sitting in the middle), #upright counter-rotates so he is
     never upside down, #facing mirrors him on the return half so he always
     faces the direction he is travelling. */
  #rig { position: absolute; inset: 0; z-index: 2; }
  #arm {
    position: absolute; top: 50%; left: 50%;
    width: 0; height: 0;
    animation: orbit var(--orbit-dur, 3s) linear infinite;
    animation-play-state: paused;
  }
  #radius {
    transform: translateX(var(--orbit-r, 0px));
    transition: transform 1s ease;
  }
  #upright {
    animation: orbit var(--orbit-dur, 3s) linear infinite reverse;
    animation-play-state: paused;
  }
  #facing {
    animation: facing var(--orbit-dur, 3s) steps(1) infinite;
    animation-play-state: paused;
  }
  #stage.orbiting #arm,
  #stage.orbiting #upright,
  #stage.orbiting #facing { animation-play-state: running; }
  @keyframes orbit  { to { transform: rotate(360deg); } }
  @keyframes facing { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }

  /* ---- Villiam ---- */
  #dog {
    width: var(--dog-size, 150px);
    margin: calc(var(--dog-size, 150px) / -2) 0 0 calc(var(--dog-size, 150px) / -2);
    transition: width 1s ease, margin 1s ease;
  }
  #dog svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* Photo override: if a real cutout loads, it replaces the vector sprite */
  #photo {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    display: none;
  }
  #stage.has-photo #photo { display: block; }
  #stage.has-photo #vector { display: none; }

  /* ---- Puppet motion: each part moves on its own clock ---- */
  #body-grp  { animation: bodybob var(--bob, 1.6s) ease-in-out infinite alternate; }
  #head-grp  { animation: headbob var(--bob, 1.6s) ease-in-out infinite alternate;
               transform-origin: 74px 52px; }
  #ear-near, #ear-far { animation: earswing var(--bob, 1.6s) ease-in-out infinite alternate; }
  #ear-near { transform-origin: 100px 36px; }
  #ear-far  { transform-origin: 94px 36px; }
  #tail-grp { animation: tailwag var(--wag, 1.1s) ease-in-out infinite alternate;
              transform-origin: 34px 54px; }
  #leg-fn, #leg-bf { animation: gaitA var(--gait, 0.5s) ease-in-out infinite alternate; }
  #leg-ff, #leg-bn { animation: gaitB var(--gait, 0.5s) ease-in-out infinite alternate; }
  #leg-fn { transform-origin: 92px 70px; }
  #leg-ff { transform-origin: 85px 70px; }
  #leg-bn { transform-origin: 50px 70px; }
  #leg-bf { transform-origin: 43px 70px; }

  @keyframes bodybob  { from { transform: translateY(0); }    to { transform: translateY(-2.5px); } }
  @keyframes headbob  { from { transform: rotate(-2deg); }    to { transform: rotate(3deg); } }
  @keyframes earswing { from { transform: rotate(-6deg); }    to { transform: rotate(7deg); } }
  @keyframes tailwag  { from { transform: rotate(-14deg); }   to { transform: rotate(16deg); } }
  @keyframes gaitA    { from { transform: rotate(-20deg); }   to { transform: rotate(20deg); } }
  @keyframes gaitB    { from { transform: rotate(20deg); }    to { transform: rotate(-20deg); } }

  /* Sleeping: legs fold under, body settles onto them, eye shuts, breathing */
  #eye-shut { display: none; }
  #stage.sleeping #eye-open { display: none; }
  #stage.sleeping #eye-shut { display: block; }
  #stage.sleeping #dog { transform: translateY(7%); }
  #stage.sleeping #leg-fn, #stage.sleeping #leg-ff,
  #stage.sleeping #leg-bn, #stage.sleeping #leg-bf {
    animation: none;
    transform: scaleY(0.18);
  }
  #stage.sleeping #body-grp {
    animation: breathe 3.4s ease-in-out infinite alternate;
    transform-origin: 68px 76px;
  }
  #stage.sleeping #head-grp { animation: dozehead 3.4s ease-in-out infinite alternate; }
  #stage.sleeping #tail-grp { animation: tailwag 3.6s ease-in-out infinite alternate; }
  @keyframes breathe  { from { transform: translateY(14px) scaleY(1); }
                        to   { transform: translateY(14px) scaleY(1.04); } }
  @keyframes dozehead { from { transform: translateY(15px) rotate(5deg); }
                        to   { transform: translateY(16px) rotate(7deg); } }

  /* ---- Floating z's ---- */
  #zzz {
    position: absolute;
    top: 12%; right: 20%;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #zzz.visible { opacity: 1; }
  #zzz span {
    position: absolute;
    color: #9db9e8;
    font-weight: 700;
    animation: floatz 3s ease-in infinite;
  }
  #zzz span:nth-child(1) { font-size: 22px; animation-delay: 0s;   }
  #zzz span:nth-child(2) { font-size: 30px; animation-delay: 1s;   }
  #zzz span:nth-child(3) { font-size: 40px; animation-delay: 2s;   }
  @keyframes floatz {
    0%   { transform: translate(0, 0) rotate(8deg);      opacity: 0; }
    20%  { opacity: 0.9; }
    100% { transform: translate(26px, -60px) rotate(-6deg); opacity: 0; }
  }

  /* ---- Readout ---- */
  #readout {
    position: absolute;
    bottom: 11%;
    z-index: 4;
    text-align: center;
    color: #e8e8e8;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  }
  #state-label {
    font-size: 15px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--c-sleep);
    transition: color 1.6s ease;
    margin-bottom: 4px;
  }
  #temps { font-size: 20px; font-weight: 600; }
  /* While Villiam laps the rim the centre is empty, so move the readout
     there instead of letting him run straight through the text. */
  #stage.orbiting #readout {
    bottom: auto; top: 50%;
    transform: translateY(-50%);
  }
  #loads { font-size: 13px; opacity: 0.65; margin-top: 2px; }

  #demo-badge {
    position: absolute; top: 12%;
    z-index: 4;
    font-size: 11px; letter-spacing: 0.2em;
    color: #777;
    display: none;
  }
  #demo-badge.visible { display: block; }

  @media (prefers-reduced-motion: reduce) {
    #arm, #upright, #facing, #body-grp, #head-grp, #ear-near, #ear-far,
    #tail-grp, #leg-fn, #leg-ff, #leg-bn, #leg-bf, #zzz span { animation: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="ring"></div>

  <div id="zzz"><span>z</span><span>z</span><span>Z</span></div>

  <div id="rig">
    <div id="arm"><div id="radius"><div id="upright"><div id="facing">
      <div id="dog">
        <img id="photo" alt="">
        <svg id="vector" viewBox="0 0 150 105" xmlns="http://www.w3.org/2000/svg">
          <g id="tail-grp">
            <path d="M36 54 C24 50 16 38 14 26 C22 32 26 40 32 44 C28 34 28 26 32 20 C36 30 38 40 42 48 Z"
                  fill="var(--fur-cream)" stroke="var(--fur-shadow)" stroke-width="1"/>
          </g>
          <g id="leg-bf"><rect x="39" y="68" width="8" height="26" rx="4" fill="var(--fur-shadow)"/></g>
          <g id="leg-ff"><rect x="81" y="68" width="8" height="26" rx="4" fill="var(--fur-shadow)"/></g>
          <g id="body-grp">
            <ellipse cx="68" cy="58" rx="32" ry="19" fill="var(--fur-cream)"/>
            <path d="M44 44 C54 38 74 38 88 46 C80 52 58 54 44 50 Z" fill="var(--fur-chest)"/>
            <ellipse cx="68" cy="63" rx="26" ry="13" fill="var(--fur-cream)"/>
          </g>
          <g id="leg-bn"><rect x="47" y="68" width="9" height="27" rx="4.5" fill="var(--fur-cream)" stroke="var(--fur-shadow)" stroke-width="0.8"/></g>
          <g id="leg-fn"><rect x="89" y="68" width="9" height="27" rx="4.5" fill="var(--fur-cream)" stroke="var(--fur-shadow)" stroke-width="0.8"/></g>
          <g id="ear-far">
            <path d="M92 34 C82 40 80 58 86 70 C92 62 94 46 96 38 Z" fill="var(--fur-chest-d)"/>
          </g>
          <g id="head-grp">
            <path d="M78 56 C74 46 78 36 88 32 L102 32 C106 40 104 50 96 56 Z" fill="var(--fur-cream)"/>
            <circle cx="103" cy="42" r="17" fill="var(--fur-cream)"/>
            <path d="M96 27 C104 24 114 26 118 33 C112 30 102 29 96 31 Z" fill="var(--fur-chest)"/>
            <path d="M103 25 C110 25 116 29 119 35 C114 33 107 32 103 33 Z" fill="var(--fur-chest)"/>
            <ellipse cx="122" cy="48" rx="11" ry="8.5" fill="var(--fur-cream)"/>
            <path d="M110 30 C114 34 115 42 114 50 C111 44 110 36 110 30 Z" fill="var(--fur-cream)"/>
            <ellipse cx="131" cy="45" rx="4" ry="3.4" fill="var(--nose)"/>
            <path d="M118 54 C122 56 126 55 128 53" stroke="var(--fur-shadow)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
            <g id="ear-near">
              <path d="M100 30 C112 34 116 54 110 72 C100 64 96 44 96 34 Z" fill="var(--fur-chest)"/>
              <path d="M104 60 C108 66 110 70 110 72 C106 71 103 66 102 62 Z" fill="var(--fur-chest-d)"/>
            </g>
            <g id="eye-open">
              <circle cx="117" cy="40" r="2.9" fill="var(--nose)"/>
              <circle cx="118" cy="39" r="1" fill="#fff" opacity="0.9"/>
            </g>
            <path id="eye-shut" d="M113.5 40.5 C115.5 42.6 118.5 42.6 120.5 40.5"
                  stroke="var(--nose)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <rect x="86" y="55" width="16" height="5" rx="2.5" fill="var(--collar)"/>
          </g>
        </svg>
      </div>
    </div></div></div></div>
  </div>

  <div id="demo-badge">DEMO MODE</div>

  <div id="readout">
    <div id="state-label">sleeping</div>
    <div id="temps">-- · --</div>
    <div id="loads"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — tune everything here
   ============================================================ */
const CONFIG = {
  // Optional photo cutouts. If a file loads it replaces the vector
  // sprite for that state; if it 404s the vector is used. Transparent
  // PNG / WebP only — a rectangular photo cannot travel the rim.
  assets: {
    sleep: "sleeping.webp",
    walk:  "walking.webp",
    run:   "running.webp",
    panic: "panic.webp",
  },

  // Stress is driven by LOAD ONLY. Temperatures depend entirely on your
  // cooling setup and fan curves — a good loop stays cool at full tilt and
  // would never trigger, a bad one would sit in panic at idle. Loads are
  // comparable across machines, so they decide the state. Temps are still
  // displayed, just not used. Flip includeTemps once you know your curves.
  includeTemps: false,
  tempMin: 35,   // only used when includeTemps is true
  tempMax: 85,

  // 1.0 = stress is simply the highest load percentage seen.
  loadWeight: 1.0,

  // Stress thresholds for state transitions (0..100)
  thresholds: { walk: 25, run: 50, panic: 75 },

  // Hysteresis: state only changes after crossing a threshold by this
  // margin, so Villiam doesn't flicker at boundaries.
  hysteresis: 4,

  // Per-state motion. gait/bob/wag are CSS durations in seconds (smaller =
  // faster). size and orbitR are PERCENTAGES of the panel's smaller
  // dimension, so everything scales to whatever resolution CAM reports
  // instead of assuming a fixed pixel size.
  motion: {
    sleep: { size: 64, gait: 0,    bob: 3.4,  wag: 2.4, orbitR: 0,  orbitDur: 0 },
    walk:  { size: 58, gait: 0.7,  bob: 1.5,  wag: 1.1, orbitR: 0,  orbitDur: 0 },
    run:   { size: 48, gait: 0.3,  bob: 0.5,  wag: 0.5, orbitR: 0,  orbitDur: 0 },
    panic: { size: 26, gait: 0.13, bob: 0.22, wag: 0.2, orbitR: 66, orbitDur: 1.6 },
  },

  showReadout: true,
};

const STATES = ["sleep", "walk", "run", "panic"];
const LABELS = { sleep: "sleeping", walk: "pacing", run: "running", panic: "MELTDOWN" };
const COLORS = {
  sleep: getCss("--c-sleep"), walk: getCss("--c-walk"),
  run: getCss("--c-run"), panic: getCss("--c-panic"),
};

function getCss(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ---- optional photo assets, probed once ---- */
const photoOk = { sleep: false, walk: false, run: false, panic: false };
for (const s of STATES) {
  const probe = new Image();
  probe.onload  = () => { photoOk[s] = true;  render(); };
  probe.onerror = () => { photoOk[s] = false; };
  probe.src = CONFIG.assets[s];
}

/* ============================================================
   STRESS MODEL
   ============================================================ */
function normTemp(t) {
  if (t == null || isNaN(t)) return 0;
  return clamp(((t - CONFIG.tempMin) / (CONFIG.tempMax - CONFIG.tempMin)) * 100, 0, 100);
}
function normLoad(l) {
  if (l == null || isNaN(l)) return 0;
  const pct = l <= 1 ? l * 100 : l;   // CAM may report 0..1 or 0..100
  return clamp(pct, 0, 100) * CONFIG.loadWeight;
}
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

function computeStress(m) {
  const signals = [normLoad(m.cpuLoad), normLoad(m.gpuLoad)];
  if (CONFIG.includeTemps) signals.push(normTemp(m.cpuTemp), normTemp(m.gpuTemp));
  return Math.max(...signals);
}

/* ---- state machine with hysteresis ---- */
let currentState = "sleep";
function nextState(stress) {
  const t = CONFIG.thresholds, h = CONFIG.hysteresis;
  const up   = [t.walk + h, t.run + h, t.panic + h]; // must exceed to climb
  const down = [t.walk - h, t.run - h, t.panic - h]; // must drop below to fall
  let target = STATES.indexOf(currentState);
  while (target < 3 && stress >= up[target]) target++;
  while (target > 0 && stress < down[target - 1]) target--;
  return STATES[target];
}

/* ============================================================
   RENDER
   ============================================================ */
const stage = document.getElementById("stage");
const glow = document.getElementById("glow");
const ring = document.getElementById("ring");
const zzz = document.getElementById("zzz");
const photo = document.getElementById("photo");
const stateLabel = document.getElementById("state-label");
const tempsEl = document.getElementById("temps");
const loadsEl = document.getElementById("loads");

let lastMetrics = {};

function render() {
  const s = currentState;
  const color = COLORS[s];
  const m = CONFIG.motion[s];

  glow.style.backgroundColor = color;
  ring.style.borderColor = color;
  stateLabel.style.color = color;
  stateLabel.textContent = LABELS[s];

  // Size and orbit radius are percentages of the panel's smaller dimension,
  // resolved to px here so they track whatever resolution CAM reports.
  const minDim = Math.min(stage.clientWidth, stage.clientHeight) || 240;
  const rPx = (minDim / 2) * (m.orbitR / 100);
  stage.style.setProperty("--orbit-r", rPx.toFixed(1) + "px");
  stage.style.setProperty("--orbit-dur", (m.orbitDur || 3) + "s");
  stage.style.setProperty("--dog-size", (minDim * m.size / 100).toFixed(1) + "px");
  stage.style.setProperty("--gait", (m.gait || 0.5) + "s");
  stage.style.setProperty("--bob", m.bob + "s");
  stage.style.setProperty("--wag", m.wag + "s");

  stage.classList.toggle("orbiting", m.orbitR > 0);
  stage.classList.toggle("sleeping", s === "sleep");
  stage.classList.toggle("has-photo", photoOk[s]);
  if (photoOk[s]) photo.src = CONFIG.assets[s];

  zzz.classList.toggle("visible", s === "sleep");

  if (CONFIG.showReadout) {
    const f = (v) => (v == null || isNaN(v)) ? "--" : Math.round(v);
    tempsEl.textContent = `CPU ${f(lastMetrics.cpuTemp)}° · GPU ${f(lastMetrics.gpuTemp)}°`;
    const lp = (v) => (v == null || isNaN(v)) ? "--" : Math.round(v <= 1 ? v * 100 : v);
    loadsEl.textContent = `load ${lp(lastMetrics.cpuLoad)}% / ${lp(lastMetrics.gpuLoad)}%`;
  } else {
    document.getElementById("readout").style.display = "none";
  }
}

function update(metrics) {
  lastMetrics = metrics;
  const stress = computeStress(metrics);
  const s = nextState(stress);
  if (s !== currentState) { currentState = s; }
  render();
}

/* ============================================================
   NZXT CAM HOOKUP
   Merge into window.nzxt without clobbering width/height/shape
   that CAM injects. CAM starts streaming once it detects
   onMonitoringDataUpdate.
   ============================================================ */
let gotCamData = false;

window.nzxt = window.nzxt || {};
window.nzxt.v1 = Object.assign(window.nzxt.v1 || {}, {
  onMonitoringDataUpdate: (data) => {
    gotCamData = true;
    const cpu = (data.cpus && data.cpus[0]) || {};
    const gpu = (data.gpus && data.gpus[0]) || {};
    update({
      cpuTemp: cpu.temperature,
      gpuTemp: gpu.temperature,
      cpuLoad: cpu.load,
      gpuLoad: gpu.load,
    });
  },
});

/* ============================================================
   DEMO MODE — runs when opened in a normal browser (no CAM),
   or with ?demo=1. Stress oscillates through all four states;
   click/tap anywhere to jump ahead. ?state=panic pins one state.
   ============================================================ */
const qs = new URLSearchParams(location.search);
const forceDemo = qs.get("demo") === "1";
const pinned = qs.get("state");
let demoPhase = 0;

if (pinned && STATES.includes(pinned)) {
  currentState = pinned;
  render();
} else {
  setTimeout(() => {
    if (gotCamData && !forceDemo) return;
    document.getElementById("demo-badge").classList.add("visible");

    setInterval(() => {
      if (gotCamData && !forceDemo) return;
      demoPhase += 0.02;
      const stress = (Math.sin(demoPhase) * 0.5 + 0.5) * 100;
      update({
        cpuLoad: stress * 0.8,
        gpuLoad: stress,
        // plausible temps purely for the readout; they do not drive state
        cpuTemp: 38 + (stress / 100) * 42,
        gpuTemp: 34 + (stress / 100) * 40,
      });
    }, 200);

    document.body.addEventListener("click", () => { demoPhase += 0.8; });
  }, 2500);
}

window.addEventListener("resize", render);
render();
</script>
</body>
</html>
