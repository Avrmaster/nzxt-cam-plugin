<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Villiam Thermal Companion</title>
<style>
  :root {
    /* State colors: sleep → walk → run → panic */
    --c-sleep: #2d6cdf;
    --c-walk:  #22b573;
    --c-run:   #f5a623;
    --c-panic: #e23b3b;
    --trans: 2s;   /* overwritten from CONFIG.transitionSec at startup */
    /* Villiam's actual colouring, sampled from his photos */
    --fur-cream:   #f7efe2;
    --fur-shadow:  #e0d3bf;
    --fur-chest:   #b06231;
    --fur-chest-d: #8d4c24;
    --nose:        #2b2725;
    --collar:      #57bd2c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    user-select: none;
  }

  #stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  #glow {
    position: absolute;
    width: 88%; aspect-ratio: 1;
    border-radius: 50%;
    background-color: var(--c-sleep);
    opacity: 0.32;
    filter: blur(48px);
    transition: background-color var(--trans) ease;
  }

  #ring {
    position: absolute; inset: 2%;
    border-radius: 50%;
    border: 3px solid var(--c-sleep);
    opacity: 0.85;
    transition: border-color var(--trans) ease;
  }

  /* ---- Orbit rig: hamster wheel ----
     #arm rotates around the centre and #radius pushes Villiam out to the rim
     (radius 0 = sitting in the middle). #orient then holds him at a fixed
     -90deg so his paws point radially OUTWARD at every point of the lap —
     he runs along the inside of the bezel like a hamster in a wheel, going
     briefly upside down at the top. Because he inherits the arm's rotation,
     the -90deg is all that's needed: no counter-rotation, no mirroring.
     The arm runs in reverse so his nose leads the direction of travel. */
  #rig { position: absolute; inset: 0; z-index: 2; }
  #arm {
    position: absolute; top: 50%; left: 50%;
    width: 0; height: 0;
  }
  #radius {
    transform: translateX(var(--orbit-r, 0px));
    transition: transform var(--trans) ease;
  }
  #orient {
    transform: rotate(0deg);
    transition: transform var(--trans) ease;
  }
  #stage.orbiting #orient { transform: rotate(var(--feet-rot, -90deg)); }
  #stage.orbiting #arm {
    animation: orbit var(--orbit-dur, 3s) linear infinite reverse;
  }
  @keyframes orbit { to { transform: rotate(360deg); } }

  /* ---- Villiam ---- */
  #dog {
    width: var(--dog-size, 150px);
    margin: calc(var(--dog-size, 150px) * -0.35) 0 0 calc(var(--dog-size, 150px) / -2);
    transition: width var(--trans) ease, margin var(--trans) ease;
  }
  #dog svg { width: 100%; height: auto; display: block; overflow: visible; }

  /* Photo override: if a real cutout loads, it replaces the vector sprite */
  #photo {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    display: none;
  }
  #stage.has-photo #photo { display: block; }
  #stage.has-photo #vector { display: none; }

  /* ---- Puppet motion: each part moves on its own clock ---- */
  #body-grp  { animation: bodybob var(--bob, 1.6s) ease-in-out infinite alternate; }
  #head-grp  { animation: headbob var(--bob, 1.6s) ease-in-out infinite alternate;
               transform-origin: 74px 52px; }
  #ear-near, #ear-far { animation: earswing var(--bob, 1.6s) ease-in-out infinite alternate; }
  #ear-near { transform-origin: 100px 36px; }
  #ear-far  { transform-origin: 94px 36px; }
  #tail-grp { animation: tailwag var(--wag, 1.1s) ease-in-out infinite alternate;
              transform-origin: 34px 54px; }
  #leg-fn, #leg-bf { animation: gaitA var(--gait, 0.5s) ease-in-out infinite alternate; }
  #leg-ff, #leg-bn { animation: gaitB var(--gait, 0.5s) ease-in-out infinite alternate; }
  #leg-fn { transform-origin: 92px 70px; }
  #leg-ff { transform-origin: 85px 70px; }
  #leg-bn { transform-origin: 50px 70px; }
  #leg-bf { transform-origin: 43px 70px; }

  @keyframes bodybob  { from { transform: translateY(0); }    to { transform: translateY(-2.5px); } }
  @keyframes headbob  { from { transform: rotate(-2deg); }    to { transform: rotate(3deg); } }
  @keyframes earswing { from { transform: rotate(-6deg); }    to { transform: rotate(7deg); } }
  @keyframes tailwag  { from { transform: rotate(-14deg); }   to { transform: rotate(16deg); } }
  @keyframes gaitA    { from { transform: rotate(-20deg); }   to { transform: rotate(20deg); } }
  @keyframes gaitB    { from { transform: rotate(20deg); }    to { transform: rotate(-20deg); } }

  /* Sleeping: legs fold under, body settles onto them, eye shuts, breathing */
  #eye-shut { display: none; }
  #stage.sleeping #eye-open { display: none; }
  #stage.sleeping #eye-shut { display: block; }
  #stage.sleeping #dog { transform: translateY(8%); }
  #stage.sleeping #leg-fn, #stage.sleeping #leg-ff,
  #stage.sleeping #leg-bn, #stage.sleeping #leg-bf {
    animation: none;
    transform: scaleY(0.18);
  }
  #stage.sleeping #body-grp {
    animation: breathe 3.4s ease-in-out infinite alternate;
    transform-origin: 68px 76px;
  }
  #stage.sleeping #head-grp { animation: dozehead 3.4s ease-in-out infinite alternate; }
  #stage.sleeping #tail-grp { animation: tailrest 4.2s ease-in-out infinite alternate; }
  @keyframes breathe  { from { transform: scaleY(1); }    to { transform: scaleY(1.045); } }
  @keyframes tailrest { from { transform: rotate(-80deg); } to { transform: rotate(-72deg); } }
  @keyframes dozehead { from { transform: rotate(4deg); } to { transform: rotate(7deg); } }

  /* ============================================================
     SCENERY — each state gets its own little world behind Villiam.
     One SVG in a 0..100 space, clipped to the round bezel, with only
     the active scene faded in.
     ============================================================ */
  #scenery {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }
  .scene { opacity: 0; transition: opacity var(--trans) ease; }
  #stage[data-state="sleep"] .s-sleep,
  #stage[data-state="walk"]  .s-walk,
  #stage[data-state="run"]   .s-run,
  #stage[data-state="panic"] .s-panic { opacity: 1; }

  /* --- night --- */
  .moon { fill: #d9e5fb; opacity: 0.9; }
  .stars circle { fill: #eaf1ff; animation: twinkle 3.2s ease-in-out infinite; }
  .stars circle:nth-child(4n+2) { animation-delay: 0.8s; animation-duration: 4.1s; }
  .stars circle:nth-child(4n+3) { animation-delay: 1.6s; animation-duration: 2.6s; }
  .stars circle:nth-child(4n)   { animation-delay: 2.4s; animation-duration: 3.7s; }
  .cushion { fill: #10305c; opacity: 0.8; }

  /* --- daylight --- */
  .sun  { fill: #ffe9ab; animation: sunpulse 5s ease-in-out infinite alternate; }
  .haze { fill: #ffe9ab; opacity: 0.12; }
  .tuft { fill: #5cc47e; opacity: 0.6; }
  .tuft-dim { fill: #b98a4a; opacity: 0.5; }
  .horizon { stroke: #ffffff; stroke-width: 0.4; opacity: 0.12; }
  .scroll-slow { animation: scroll 5s linear infinite; }
  .bfly { animation: drift 11s linear infinite; }
  .b2 { animation-delay: 0.09s; opacity: 0.85; }
  .bwing {
    fill: #ffd2ea;
    animation: flap 0.26s ease-in-out infinite alternate;
    transform-box: fill-box; transform-origin: right center;
  }

  /* --- chase --- */
  .scroll-fast { animation: scroll 1.15s linear infinite; }
  .sl { fill: #ffd79a; animation: zip 0.6s linear infinite; }
  .sl:nth-child(2) { animation-delay: 0.12s; }
  .sl:nth-child(3) { animation-delay: 0.26s; }
  .sl:nth-child(4) { animation-delay: 0.38s; }
  .sl:nth-child(5) { animation-delay: 0.5s; }
  .dust circle {
    fill: #d9bb8d;
    animation: puff 0.75s ease-out infinite;
    transform-box: fill-box; transform-origin: center;
  }
  .dust circle:nth-child(2) { animation-delay: 0.25s; }
  .dust circle:nth-child(3) { animation-delay: 0.5s; }
  .ball { animation: rollpath 2s linear infinite; }
  .ballspin {
    animation: spin360 0.45s linear infinite;
    transform-box: fill-box; transform-origin: center;
  }

  /* --- meltdown --- */
  .warnring {
    fill: none; stroke: #ff7a4d; stroke-width: 1.1; opacity: 0.45;
    stroke-dasharray: 3 6;
    animation: warnspin 7s linear infinite;
    transform-box: fill-box; transform-origin: center;
  }
  .embers circle {
    fill: #ffab4d;
    animation: rise 2.3s ease-out infinite;
    transform-box: fill-box; transform-origin: center;
  }
  .embers circle:nth-child(3n+1) { animation-delay: 0.4s; animation-duration: 1.9s; }
  .embers circle:nth-child(3n+2) { animation-delay: 1.1s; animation-duration: 2.7s; }
  .core { fill: #ffd24a !important; opacity: 0.75; }
  .flame {
    fill: #ff7f33; opacity: 0.7;
    animation: lick 0.42s ease-in-out infinite alternate;
    transform-box: fill-box; transform-origin: bottom center;
  }
  .flame:nth-child(2) { animation-delay: 0.13s; }
  .flame:nth-child(3) { animation-delay: 0.27s; }
  .flame:nth-child(4) { animation-delay: 0.08s; }
  .flame:nth-child(5) { animation-delay: 0.2s; }
  .flame:nth-child(6) { animation-delay: 0.33s; }
  #stage[data-state="panic"] { animation: shake 0.19s linear infinite; }

  @keyframes twinkle  { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
  @keyframes sunpulse { from { opacity: 0.42; } to { opacity: 0.66; } }
  @keyframes scroll   { to { transform: translateX(-50px); } }
  @keyframes drift    { from { transform: translate(46px, 4px); }
                        to   { transform: translate(-52px, -12px); } }
  @keyframes flap     { from { transform: scaleX(0.3); } to { transform: scaleX(1); } }
  @keyframes zip      { from { transform: translateX(0); opacity: 0.6; }
                        to   { transform: translateX(-44px); opacity: 0; } }
  @keyframes puff     { 0%   { opacity: 0.45; transform: scale(0.4); }
                        100% { opacity: 0; transform: scale(2.2) translateX(-5px); } }
  @keyframes rollpath { from { transform: translateX(40px); }
                        to   { transform: translateX(-44px); } }
  @keyframes spin360  { to { transform: rotate(-360deg); } }
  @keyframes rise     { 0%   { opacity: 0; transform: translateY(0) scale(0.6); }
                        18%  { opacity: 0.95; }
                        100% { opacity: 0; transform: translateY(-32px) scale(0.25); } }
  @keyframes lick     { from { transform: scaleY(0.65); } to { transform: scaleY(1.3); } }
  @keyframes warnspin { to { transform: rotate(360deg); } }
  @keyframes shake    { 0%   { transform: translate(0, 0); }
                        25%  { transform: translate(0.9px, -0.7px); }
                        50%  { transform: translate(-0.8px, 0.8px); }
                        75%  { transform: translate(0.6px, 0.5px); }
                        100% { transform: translate(0, 0); } }

  /* Villiam stands nearer the ground when there is ground to stand on */
  #stage[data-state="walk"] #dog,
  #stage[data-state="run"]  #dog { transform: translateY(32%); }

  /* ---- Floating z's ---- */
  #zzz {
    position: absolute;
    top: 12%; right: 20%;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity var(--trans) ease;
  }
  #zzz.visible { opacity: 1; }
  #zzz span {
    position: absolute;
    color: #9db9e8;
    font-weight: 700;
    animation: floatz 3s ease-in infinite;
  }
  #zzz span:nth-child(1) { font-size: 22px; animation-delay: 0s;   }
  #zzz span:nth-child(2) { font-size: 30px; animation-delay: 1s;   }
  #zzz span:nth-child(3) { font-size: 40px; animation-delay: 2s;   }
  @keyframes floatz {
    0%   { transform: translate(0, 0) rotate(8deg);      opacity: 0; }
    20%  { opacity: 0.9; }
    100% { transform: translate(26px, -60px) rotate(-6deg); opacity: 0; }
  }

  /* ---- Readout ---- */
  #readout {
    position: absolute;
    bottom: 11%;
    z-index: 4;
    text-align: center;
    color: #e8e8e8;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  }
  #state-label {
    font-size: 15px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--c-sleep);
    transition: color var(--trans) ease;
    margin-bottom: 4px;
  }
  #temps { font-size: 20px; font-weight: 600; }
  /* While Villiam laps the rim the centre is empty, so move the readout
     there instead of letting him run straight through the text. */
  #stage.orbiting #readout {
    bottom: auto; top: 50%;
    transform: translateY(-50%);
  }
  #loads { font-size: 13px; opacity: 0.65; margin-top: 2px; }

  #demo-badge {
    position: absolute; top: 12%;
    z-index: 4;
    font-size: 11px; letter-spacing: 0.2em;
    color: #777;
    display: none;
  }
  #demo-badge.visible { display: block; }

  #debug {
    position: absolute; top: 4%; left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    font-size: 10px; line-height: 1.35;
    color: #7fe08f;
    text-align: center;
    white-space: pre;
    text-shadow: 0 1px 3px #000;
  }

  @media (prefers-reduced-motion: reduce) {
    #arm, #orient, #body-grp, #head-grp, #ear-near, #ear-far,
    #tail-grp, #leg-fn, #leg-ff, #leg-bn, #leg-bf, #zzz span { animation: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="ring"></div>

  <svg id="scenery" viewBox="0 0 100 100" preserveAspectRatio="none">
    <defs>
      <clipPath id="disc"><circle cx="50" cy="50" r="49"/></clipPath>
      <mask id="moonmask">
        <rect x="0" y="0" width="100" height="100" fill="#fff"/>
        <circle cx="66" cy="19" r="9" fill="#000"/>
      </mask>
    </defs>
    <g clip-path="url(#disc)">

      <g class="scene s-sleep">
        <circle class="moon" cx="71" cy="22" r="10.5" mask="url(#moonmask)"/>
        <g class="stars"><circle cx="24" cy="27" r="0.85"/><circle cx="35" cy="17" r="0.6"/><circle cx="48" cy="12" r="0.75"/><circle cx="20" cy="43" r="0.7"/><circle cx="15" cy="58" r="0.85"/><circle cx="27" cy="71" r="0.6"/><circle cx="84" cy="45" r="0.8"/><circle cx="80" cy="61" r="0.65"/><circle cx="70" cy="75" r="0.75"/><circle cx="41" cy="86" r="0.6"/><circle cx="58" cy="88" r="0.7"/><circle cx="88" cy="53" r="0.55"/></g>
        <ellipse class="cushion" cx="50" cy="67" rx="28" ry="6"/>
      </g>

      <g class="scene s-walk">
        <circle class="haze" cx="76" cy="18" r="13"/>
        <circle class="sun" cx="76" cy="18" r="7"/>
        <line class="horizon" x1="0" y1="75" x2="100" y2="75"/>
        <g class="scroll-slow"><g transform="translate(0,0)"><path class="tuft" d="M3 75 l1 -4.4 l1 4.4 z"/><path class="tuft" d="M11 75 l1 -3.2 l1 3.2 z"/><path class="tuft" d="M18 75 l1 -5.0 l1 5.0 z"/><path class="tuft" d="M26 75 l1 -3.8 l1 3.8 z"/><path class="tuft" d="M34 75 l1 -4.6 l1 4.6 z"/><path class="tuft" d="M42 75 l1 -3.4 l1 3.4 z"/></g><g transform="translate(50,0)"><path class="tuft" d="M3 75 l1 -4.4 l1 4.4 z"/><path class="tuft" d="M11 75 l1 -3.2 l1 3.2 z"/><path class="tuft" d="M18 75 l1 -5.0 l1 5.0 z"/><path class="tuft" d="M26 75 l1 -3.8 l1 3.8 z"/><path class="tuft" d="M34 75 l1 -4.6 l1 4.6 z"/><path class="tuft" d="M42 75 l1 -3.4 l1 3.4 z"/></g><g transform="translate(100,0)"><path class="tuft" d="M3 75 l1 -4.4 l1 4.4 z"/><path class="tuft" d="M11 75 l1 -3.2 l1 3.2 z"/><path class="tuft" d="M18 75 l1 -5.0 l1 5.0 z"/><path class="tuft" d="M26 75 l1 -3.8 l1 3.8 z"/><path class="tuft" d="M34 75 l1 -4.6 l1 4.6 z"/><path class="tuft" d="M42 75 l1 -3.4 l1 3.4 z"/></g></g>
        <g class="bfly">
          <g class="bwing"><ellipse cx="30" cy="33.2" rx="2.7" ry="1.6"/></g>
          <g class="bwing b2"><ellipse cx="30.2" cy="36" rx="2.3" ry="1.4"/></g>
          <ellipse cx="32.4" cy="34.6" rx="0.6" ry="1.7" fill="#8a6072"/>
        </g>
      </g>

      <g class="scene s-run">
        <line class="horizon" x1="0" y1="75" x2="100" y2="75"/>
        <g class="speedlines"><rect class="sl" x="56" y="30" width="15" height="1.1" rx="0.55"/><rect class="sl" x="56" y="38" width="20" height="1.1" rx="0.55"/><rect class="sl" x="56" y="46" width="12" height="1.1" rx="0.55"/><rect class="sl" x="56" y="56" width="18" height="1.1" rx="0.55"/><rect class="sl" x="56" y="64" width="14" height="1.1" rx="0.55"/></g>
        <g class="scroll-fast"><g transform="translate(0,0)"><path class="tuft-dim" d="M3 75 l1 -4.4 l1 4.4 z"/><path class="tuft-dim" d="M11 75 l1 -3.2 l1 3.2 z"/><path class="tuft-dim" d="M18 75 l1 -5.0 l1 5.0 z"/><path class="tuft-dim" d="M26 75 l1 -3.8 l1 3.8 z"/><path class="tuft-dim" d="M34 75 l1 -4.6 l1 4.6 z"/><path class="tuft-dim" d="M42 75 l1 -3.4 l1 3.4 z"/></g><g transform="translate(50,0)"><path class="tuft-dim" d="M3 75 l1 -4.4 l1 4.4 z"/><path class="tuft-dim" d="M11 75 l1 -3.2 l1 3.2 z"/><path class="tuft-dim" d="M18 75 l1 -5.0 l1 5.0 z"/><path class="tuft-dim" d="M26 75 l1 -3.8 l1 3.8 z"/><path class="tuft-dim" d="M34 75 l1 -4.6 l1 4.6 z"/><path class="tuft-dim" d="M42 75 l1 -3.4 l1 3.4 z"/></g><g transform="translate(100,0)"><path class="tuft-dim" d="M3 75 l1 -4.4 l1 4.4 z"/><path class="tuft-dim" d="M11 75 l1 -3.2 l1 3.2 z"/><path class="tuft-dim" d="M18 75 l1 -5.0 l1 5.0 z"/><path class="tuft-dim" d="M26 75 l1 -3.8 l1 3.8 z"/><path class="tuft-dim" d="M34 75 l1 -4.6 l1 4.6 z"/><path class="tuft-dim" d="M42 75 l1 -3.4 l1 3.4 z"/></g></g>
        <g class="dust">
          <circle cx="36" cy="73" r="2.2"/><circle cx="32" cy="74" r="2.6"/><circle cx="28" cy="72" r="2"/>
        </g>
        <g class="ball">
          <g class="ballspin">
            <circle cx="50" cy="71" r="3.1" fill="#d8e04a"/>
            <path d="M47.2 69.6 q2.8 1.4 5.6 0" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.8"/>
            <path d="M47.2 72.4 q2.8 -1.4 5.6 0" stroke="#fff" stroke-width="0.5" fill="none" opacity="0.8"/>
          </g>
        </g>
      </g>

      <g class="scene s-panic">
        <circle class="warnring" cx="50" cy="50" r="44"/>
        <g class="flames">
          <path class="flame" d="M27 93 C24 87 27 82 29 77 C32 83 34 88 27 93 Z"/>
          <path class="flame" d="M41 96 C37 89 41 82 43 76 C47 83 49 90 41 96 Z"/>
          <path class="flame" d="M56 95 C52 89 55 83 57 78 C60 84 63 90 56 95 Z"/>
          <path class="flame" d="M69 92 C66 87 68 82 70 78 C73 83 75 88 69 92 Z"/>
          <path class="flame core" d="M42 94 C40 89 42 85 43 81 C45 85 46 90 42 94 Z"/>
          <path class="flame core" d="M57 93 C55 89 57 85 58 82 C60 86 61 90 57 93 Z"/>
        </g>
        <g class="embers"><circle cx="22" cy="74" r="0.9"/><circle cx="31" cy="80" r="0.7"/><circle cx="40" cy="76" r="1.0"/><circle cx="49" cy="82" r="0.75"/><circle cx="58" cy="77" r="0.9"/><circle cx="67" cy="81" r="0.7"/><circle cx="76" cy="75" r="0.85"/><circle cx="28" cy="68" r="0.6"/><circle cx="52" cy="70" r="0.65"/><circle cx="72" cy="69" r="0.8"/><circle cx="36" cy="84" r="0.8"/><circle cx="62" cy="85" r="0.6"/></g>
      </g>

    </g>
  </svg>

  <div id="zzz"><span>z</span><span>z</span><span>Z</span></div>

  <div id="rig">
    <div id="arm"><div id="radius"><div id="orient">
      <div id="dog">
        <img id="photo" alt="">
        <svg id="vector" viewBox="0 0 150 105" xmlns="http://www.w3.org/2000/svg">
          <g id="tail-grp">
            <path d="M36 54 C24 50 16 38 14 26 C22 32 26 40 32 44 C28 34 28 26 32 20 C36 30 38 40 42 48 Z"
                  fill="var(--fur-cream)" stroke="var(--fur-shadow)" stroke-width="1"/>
          </g>
          <g id="leg-bf"><rect x="39" y="68" width="8" height="26" rx="4" fill="var(--fur-shadow)"/></g>
          <g id="leg-ff"><rect x="81" y="68" width="8" height="26" rx="4" fill="var(--fur-shadow)"/></g>
          <g id="body-grp">
            <ellipse cx="68" cy="58" rx="32" ry="19" fill="var(--fur-cream)"/>
            <path d="M44 44 C54 38 74 38 88 46 C80 52 58 54 44 50 Z" fill="var(--fur-chest)"/>
            <ellipse cx="68" cy="63" rx="26" ry="13" fill="var(--fur-cream)"/>
          </g>
          <g id="leg-bn"><rect x="47" y="68" width="9" height="27" rx="4.5" fill="var(--fur-cream)" stroke="var(--fur-shadow)" stroke-width="0.8"/></g>
          <g id="leg-fn"><rect x="89" y="68" width="9" height="27" rx="4.5" fill="var(--fur-cream)" stroke="var(--fur-shadow)" stroke-width="0.8"/></g>
          <g id="ear-far">
            <path d="M92 34 C82 40 80 58 86 70 C92 62 94 46 96 38 Z" fill="var(--fur-chest-d)"/>
          </g>
          <g id="head-grp">
            <path d="M78 56 C74 46 78 36 88 32 L102 32 C106 40 104 50 96 56 Z" fill="var(--fur-cream)"/>
            <circle cx="103" cy="42" r="17" fill="var(--fur-cream)"/>
            <path d="M96 27 C104 24 114 26 118 33 C112 30 102 29 96 31 Z" fill="var(--fur-chest)"/>
            <path d="M103 25 C110 25 116 29 119 35 C114 33 107 32 103 33 Z" fill="var(--fur-chest)"/>
            <ellipse cx="122" cy="48" rx="11" ry="8.5" fill="var(--fur-cream)"/>
            <path d="M110 30 C114 34 115 42 114 50 C111 44 110 36 110 30 Z" fill="var(--fur-cream)"/>
            <ellipse cx="131" cy="45" rx="4" ry="3.4" fill="var(--nose)"/>
            <path d="M118 54 C122 56 126 55 128 53" stroke="var(--fur-shadow)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
            <g id="ear-near">
              <path d="M100 30 C112 34 116 54 110 72 C100 64 96 44 96 34 Z" fill="var(--fur-chest)"/>
              <path d="M104 60 C108 66 110 70 110 72 C106 71 103 66 102 62 Z" fill="var(--fur-chest-d)"/>
            </g>
            <g id="eye-open">
              <circle cx="117" cy="40" r="2.9" fill="var(--nose)"/>
              <circle cx="118" cy="39" r="1" fill="#fff" opacity="0.9"/>
            </g>
            <path id="eye-shut" d="M113.5 40.5 C115.5 42.6 118.5 42.6 120.5 40.5"
                  stroke="var(--nose)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <rect x="86" y="55" width="16" height="5" rx="2.5" fill="var(--collar)"/>
          </g>
        </svg>
      </div>
    </div></div></div>
  </div>

  <div id="demo-badge">DEMO MODE</div>

  <div id="readout">
    <div id="state-label">sleeping</div>
    <div id="temps">-- · --</div>
    <div id="loads"></div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — tune everything here
   ============================================================ */
const CONFIG = {
  // Optional photo cutouts. If a file loads it replaces the vector
  // sprite for that state; if it 404s the vector is used. Transparent
  // PNG / WebP only — a rectangular photo cannot travel the rim.
  assets: {
    sleep: "sleeping.webp",
    walk:  "walking.webp",
    run:   "running.webp",
    panic: "panic.webp",
  },

  // Stress is driven by LOAD ONLY. Temperatures depend entirely on your
  // cooling setup and fan curves — a good loop stays cool at full tilt and
  // would never trigger, a bad one would sit in panic at idle. Loads are
  // comparable across machines, so they decide the state. Temps are still
  // displayed, just not used. Flip includeTemps once you know your curves.
  includeTemps: false,
  tempMin: 35,   // only used when includeTemps is true
  tempMax: 85,

  // 1.0 = stress is simply the highest load percentage seen.
  loadWeight: 1.0,

  // Stress thresholds for state transitions (0..100)
  thresholds: { walk: 25, run: 50, panic: 75 },

  // Hysteresis: state only changes after crossing a threshold by this
  // margin, so Villiam doesn't flicker at boundaries.
  hysteresis: 6,

  // Raw load is extremely spiky — it can read 5% then 90% then 20% in three
  // consecutive seconds. Smooth it with an exponential moving average before
  // it decides anything. Lower = calmer. 0.15 at CAM's 1Hz works out to
  // roughly a 7 second response.
  smoothing: 0.15,

  // How long a state change takes to settle, in seconds. This drives the CSS
  // transitions too (via --trans), so the two can never drift apart.
  transitionSec: 2.0,

  // Extra dwell after a transition finishes before another may start. So the
  // minimum time in any state is transitionSec + holdSec.
  holdSec: 1.5,

  // Per-state motion. gait/bob/wag are CSS durations in seconds (smaller =
  // faster). size and orbitR are PERCENTAGES of the panel's smaller
  // dimension, so everything scales to whatever resolution CAM reports
  // instead of assuming a fixed pixel size.
  motion: {
    sleep: { size: 64, gait: 0,    bob: 3.4,  wag: 2.4, orbitR: 0,  orbitDur: 0 },
    walk:  { size: 58, gait: 0.7,  bob: 1.5,  wag: 1.1, orbitR: 0,  orbitDur: 0 },
    run:   { size: 48, gait: 0.3,  bob: 0.5,  wag: 0.5, orbitR: 0,  orbitDur: 0 },
    panic: { size: 26, gait: 0.13, bob: 0.22, wag: 0.2, orbitR: 81, orbitDur: 1.6 },
  },

  showReadout: true,
};

const STATES = ["sleep", "walk", "run", "panic"];
const LABELS = { sleep: "sleeping", walk: "pacing", run: "running", panic: "MELTDOWN" };
const COLORS = {
  sleep: getCss("--c-sleep"), walk: getCss("--c-walk"),
  run: getCss("--c-run"), panic: getCss("--c-panic"),
};

function getCss(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ---- optional photo assets, probed once ---- */
const photoOk = { sleep: false, walk: false, run: false, panic: false };
for (const s of STATES) {
  const probe = new Image();
  probe.onload  = () => { photoOk[s] = true;  render(); };
  probe.onerror = () => { photoOk[s] = false; };
  probe.src = CONFIG.assets[s];
}

/* ============================================================
   STRESS MODEL
   ============================================================ */
function normTemp(t) {
  if (t == null || isNaN(t)) return 0;
  return clamp(((t - CONFIG.tempMin) / (CONFIG.tempMax - CONFIG.tempMin)) * 100, 0, 100);
}
/* CAM reports load as 0..100. The old per-sample guess (l <= 1 ? l*100 : l)
   read a genuine 1% load as 100%, pinning Villiam in MELTDOWN at idle.
   Default to percent and only switch to fraction scale on unambiguous
   evidence: a non-integer strictly between 0 and 1 can only be a fraction. */
let loadIsFraction = false;
function normLoad(l) {
  if (l == null || isNaN(l)) return 0;
  if (l > 0 && l < 1 && l !== Math.floor(l)) loadIsFraction = true;
  const pct = loadIsFraction ? l * 100 : l;
  return clamp(pct, 0, 100) * CONFIG.loadWeight;
}
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

function computeStress(m) {
  const signals = [normLoad(m.cpuLoad), normLoad(m.gpuLoad)];
  if (CONFIG.includeTemps) signals.push(normTemp(m.cpuTemp), normTemp(m.gpuTemp));
  return Math.max(...signals);
}

/* ---- state machine with hysteresis ---- */
let currentState = "sleep";

/* Moves at most ONE step per call, so a cold machine launching a game escalates
   sleep -> pacing -> running -> MELTDOWN instead of snapping straight to the
   end. Combined with the dwell gate that reads as a build-up rather than a jump. */
function nextState(stress) {
  const t = CONFIG.thresholds, h = CONFIG.hysteresis;
  const up   = [t.walk + h, t.run + h, t.panic + h]; // must exceed to climb
  const down = [t.walk - h, t.run - h, t.panic - h]; // must drop below to fall
  const i = STATES.indexOf(currentState);
  if (i < 3 && stress >= up[i]) return STATES[i + 1];
  if (i > 0 && stress < down[i - 1]) return STATES[i - 1];
  return currentState;
}

/* ============================================================
   RENDER
   ============================================================ */
const stage = document.getElementById("stage");
const glow = document.getElementById("glow");
const ring = document.getElementById("ring");
const zzz = document.getElementById("zzz");
const photo = document.getElementById("photo");
const stateLabel = document.getElementById("state-label");
const tempsEl = document.getElementById("temps");
const loadsEl = document.getElementById("loads");

let lastMetrics = {};
let smoothedStress = null;
let lastChangeAt = -Infinity;

/* Split deliberately. renderState touches colours, sizes and animation
   durations and runs ONLY when the state actually changes — rewriting
   animation-duration variables on every CAM sample re-evaluates the running
   animations once a second, which is visible as a stutter. renderReadout is
   the cheap text update and runs every sample. */
function renderState() {
  const s = currentState;
  const color = COLORS[s];
  const m = CONFIG.motion[s];

  glow.style.backgroundColor = color;
  ring.style.borderColor = color;
  stateLabel.style.color = color;
  stateLabel.textContent = LABELS[s];

  // Size and orbit radius are percentages of the panel's smaller dimension,
  // resolved to px here so they track whatever resolution CAM reports.
  const minDim = Math.min(stage.clientWidth, stage.clientHeight) || 240;
  const rPx = (minDim / 2) * (m.orbitR / 100);
  stage.style.setProperty("--orbit-r", rPx.toFixed(1) + "px");
  stage.style.setProperty("--orbit-dur", (m.orbitDur || 3) + "s");
  stage.style.setProperty("--dog-size", (minDim * m.size / 100).toFixed(1) + "px");
  stage.style.setProperty("--gait", (m.gait || 0.5) + "s");
  stage.style.setProperty("--bob", m.bob + "s");
  stage.style.setProperty("--wag", m.wag + "s");

  stage.dataset.state = s;
  stage.classList.toggle("orbiting", m.orbitR > 0);
  stage.classList.toggle("sleeping", s === "sleep");
  stage.classList.toggle("has-photo", photoOk[s]);
  if (photoOk[s]) photo.src = CONFIG.assets[s];

  zzz.classList.toggle("visible", s === "sleep");
}

function renderReadout() {
  if (!CONFIG.showReadout) {
    document.getElementById("readout").style.display = "none";
    return;
  }
  const f = (v) => (v == null || isNaN(v)) ? "--" : Math.round(v);
  tempsEl.textContent = `CPU ${f(lastMetrics.cpuTemp)}° · GPU ${f(lastMetrics.gpuTemp)}°`;
  const lp = (v) => (v == null || isNaN(v)) ? "--" : Math.round(loadIsFraction ? v * 100 : v);
  loadsEl.textContent = `load ${lp(lastMetrics.cpuLoad)}% / ${lp(lastMetrics.gpuLoad)}%`;
}

function render() { renderState(); renderReadout(); }

function update(metrics) {
  lastMetrics = metrics;

  // smooth the spiky raw signal before it is allowed to decide anything
  const raw = computeStress(metrics);
  smoothedStress = (smoothedStress === null)
    ? raw
    : smoothedStress + (raw - smoothedStress) * CONFIG.smoothing;

  const want = nextState(smoothedStress);
  const now = (window.performance && performance.now) ? performance.now() : Date.now();
  const gate = (CONFIG.transitionSec + CONFIG.holdSec) * 1000;

  // hold the new state until the previous transition has finished settling
  if (want !== currentState && (now - lastChangeAt) >= gate) {
    currentState = want;
    lastChangeAt = now;
    renderState();
  }
  renderReadout();
}

/* ============================================================
   NZXT CAM HOOKUP
   Merge into window.nzxt without clobbering width/height/shape
   that CAM injects. CAM starts streaming once it detects
   onMonitoringDataUpdate.
   ============================================================ */
const qs = new URLSearchParams(location.search);
const forceDemo = qs.get("demo") === "1";
const pinned = qs.get("state");
const debugOn = qs.get("debug") === "1";

let gotCamData = false;
let camUpdates = 0;
let demoTimer = null;
let demoPhase = 0;
const demoBadge = document.getElementById("demo-badge");

/* Demo mode must yield the moment CAM speaks: clear the interval AND take
   the badge back down. Previously the badge was only ever added, so on a
   real Kraken — where CAM's first sample arrives after our 2.5s grace
   period — it appeared and then stayed up forever over live data. */
function stopDemo() {
  if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  demoBadge.classList.remove("visible");
}

function startDemo() {
  if (demoTimer) return;
  demoBadge.classList.add("visible");
  demoTimer = setInterval(() => {
    demoPhase += 0.02;
    const stress = (Math.sin(demoPhase) * 0.5 + 0.5) * 100;
    update({
      cpuLoad: stress * 0.8,
      gpuLoad: stress,
      // plausible temps purely for the readout; they do not drive state
      cpuTemp: 38 + (stress / 100) * 42,
      gpuTemp: 34 + (stress / 100) * 40,
    });
  }, 200);
  document.body.addEventListener("click", () => { demoPhase += 0.8; });
}

/* ============================================================
   NZXT CAM HOOKUP
   ============================================================ */
function onMonitoringDataUpdate(data) {
  camUpdates++;
  if (!gotCamData) {
    gotCamData = true;
    if (!forceDemo) stopDemo();   // real data wins
  }
  if (forceDemo) return;          // ?demo=1 keeps the synthetic sweep
  const cpu = (data && data.cpus && data.cpus[0]) || {};
  const gpu = (data && data.gpus && data.gpus[0]) || {};
  update({
    cpuTemp: cpu.temperature,
    gpuTemp: gpu.temperature,
    cpuLoad: cpu.load,
    gpuLoad: gpu.load,
  });
}

/* CAM may create or replace window.nzxt.v1 after this script has run, which
   would silently discard our callback. Merge rather than assign, and re-assert
   for the first 20s in case it gets clobbered. */
function installHook() {
  window.nzxt = window.nzxt || {};
  window.nzxt.v1 = window.nzxt.v1 || {};
  if (window.nzxt.v1.onMonitoringDataUpdate !== onMonitoringDataUpdate) {
    window.nzxt.v1.onMonitoringDataUpdate = onMonitoringDataUpdate;
  }
}
installHook();
const hookGuard = setInterval(installHook, 500);
setTimeout(() => clearInterval(hookGuard), 20000);

/* ============================================================
   DEMO MODE — only when nothing is feeding us. ?demo=1 forces it,
   ?state=<name> pins one state, ?debug=1 shows what CAM is sending.
   ============================================================ */
if (pinned && STATES.includes(pinned)) {
  currentState = pinned;
  render();
} else if (forceDemo) {
  startDemo();
} else {
  setTimeout(() => { if (!gotCamData) startDemo(); }, 4000);
}

/* ---- on-device diagnostics ---- */
if (debugOn) {
  const dbg = document.createElement("div");
  dbg.id = "debug";
  document.getElementById("stage").appendChild(dbg);
  setInterval(() => {
    const v = (window.nzxt && window.nzxt.v1) || {};
    dbg.textContent =
      "cam:" + (gotCamData ? "YES" : "no") +
      " upd:" + camUpdates +
      " hook:" + (typeof v.onMonitoringDataUpdate === "function" ? "ok" : "LOST") +
      " demo:" + (demoTimer ? "on" : "off") +
      "\n" + (v.width || "?") + "x" + (v.height || "?") + " " + (v.shape || "?") +
      " fps:" + (v.targetFps || "?") +
      "\nstate:" + currentState +
      " cpu:" + JSON.stringify(lastMetrics.cpuLoad) +
      " gpu:" + JSON.stringify(lastMetrics.gpuLoad);
  }, 500);
}

// one source of truth for how slow everything feels
document.documentElement.style.setProperty("--trans", CONFIG.transitionSec + "s");

window.addEventListener("resize", render);
render();
</script>
</body>
</html>
